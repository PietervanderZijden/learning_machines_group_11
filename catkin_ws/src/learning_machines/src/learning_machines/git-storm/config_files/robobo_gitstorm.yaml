Models:
  WorldModel:
    InChannels: 3
    TransformerMaxLength: 100
    TransformerHiddenDim: 512
    TransformerNumLayers: 4
    TransformerNumHeads: 8
  
  Agent:
    NumLayers: 3
    HiddenDim: 512
    Gamma: 0.997
    Lambda: 0.95
