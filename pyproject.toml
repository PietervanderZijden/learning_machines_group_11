[project]
name = "learning-machines-robobo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cbor2~=5.6",
    "coppeliasim-zmqremoteapi-client~=2.0",
    "gymnasium>=1.0.0",
    "grpcio>=1.76",
    "numpy>1.24.4",
    "opencv-python>=4.10",
    "pillow>=12.0",
    "protobuf>=6.33",
    "pyzmq~=26.0",
    "stable-baselines3[extra]>=2.4.1",
    "tensorboard>=2.14.0",
    "torch>=2.9,<2.10",
    "torchvision>=0.24,<0.25",
    "lpips>=0.1.4",
    "wandb>=0.19",
    "pandas>=2.2",
    "sb3-contrib>=2.9.0",
    "pytest>=9.1.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
