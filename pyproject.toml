[project]
name = "learning-machines-robobo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cbor2~=5.6",
    "coppeliasim-zmqremoteapi-client~=2.0",
    "gymnasium>=1.0.0",
    "gym>=0.22.0",
    "numpy>=1.24.4",
    "opencv-python>=4.10",
    "pyzmq~=26.0",
    "wandb>=0.19",
    "pytest>=9.1.0",
    "mujoco>=3.9.0",
    "torch>=2.4.0",
    "ruamel.yaml>=0.17",
    "einops>=0.3.0",
    "tensorboard>=2.17",
    "moviepy>=1.0.3",
    "imageio>=2.37.3",
    "requests>=2.28.1",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/rocm7.2"
name = "pytorch-rocm"

[tool.pytest.ini_options]
testpaths = ["tests"]
